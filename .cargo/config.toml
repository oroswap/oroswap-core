# Profile settings (opt-level, lto, overflow-checks, etc.) live exclusively
# in the workspace `Cargo.toml`. Stable Cargo does not read `[profile.*]`
# from `.cargo/config.toml` (that was an unstable `-Z config-profile`
# feature that was never stabilized), so any profile block here would be
# silently ignored — and worse, would create the illusion of an override
# that diverges from the real workspace settings (FIND-014).
#
# Only target-specific rustflags belong in this file.

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-cpu=generic",
    "-C", "codegen-units=1",
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=--strip-all",
]
